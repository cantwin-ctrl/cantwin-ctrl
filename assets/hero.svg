<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" width="1120" height="320" role="img" aria-label="cantwin-ctrl — tinkerer, root-obsessed">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d12"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#16202b" stroke-width="1"/>
    </pattern>
    <linearGradient id="gline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39d353" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#39d353" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="0.55" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="1" y="1" width="1117" height="317" rx="16"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .in { animation: rise .55s cubic-bezier(.22,.8,.3,1) both; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(7px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .scan { animation: scan 7s linear infinite; }
      @keyframes scan {
        from { transform: translateY(-40px); }
        to   { transform: translateY(340px); }
      }
      .blink { animation: blink 1.15s steps(1, end) infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: .9 } }
      @media (prefers-reduced-motion: reduce) {
        .in, .scan, .blink, .pulse { animation: none; opacity: 1; }
        .in { transform: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1120" height="320" fill="url(#bg)"/>
    <rect width="1120" height="320" fill="url(#grid)" opacity="0.55"/>
    <rect class="scan" x="0" y="0" width="1120" height="42" fill="url(#gline)" opacity="0.25"/>

    <!-- title bar -->
    <rect x="0" y="0" width="1120" height="46" fill="#0f1620" opacity="0.95"/>
    <circle cx="30" cy="23" r="6" fill="#ff5f56" opacity="0.85"/>
    <circle cx="52" cy="23" r="6" fill="#ffbd2e" opacity="0.85"/>
    <circle cx="74" cy="23" r="6" fill="#27c93f" opacity="0.85"/>
    <text class="mono in" x="1120" y="28" text-anchor="end" style="animation-delay:.15s"
          font-size="14" fill="#6e7681">cantwin-ctrl@github: ~</text>
    <line x1="0" y1="46" x2="1120" y2="46" stroke="#1b2430" stroke-width="1"/>

    <!-- line 1 -->
    <g class="in mono" style="animation-delay:.35s">
      <text x="52" y="102" font-size="20" fill="#39d353">$</text>
      <text x="74" y="102" font-size="20" fill="#c9d1d9">whoami</text>
    </g>

    <!-- line 2 -->
    <g class="in mono" style="animation-delay:.65s">
      <text x="52" y="146" font-size="34" font-weight="600" fill="#f0f6fc">vk</text>
      <text x="112" y="146" font-size="34" font-weight="600" fill="#39d353">—</text>
      <text x="146" y="146" font-size="30" fill="#e6edf3">tinkerer. root-obsessed.</text>
    </g>

    <!-- line 3 -->
    <g class="in mono" style="animation-delay:.95s">
      <text x="52" y="196" font-size="19" fill="#8b949e">i take closed boxes apart and make them behave.</text>
    </g>

    <!-- line 4 -->
    <g class="in mono" style="animation-delay:1.25s">
      <text x="52" y="240" font-size="19" fill="#6e7681">android internals · magisk · reverse engineering · shell · c · python · esp32</text>
    </g>

    <!-- prompt with cursor -->
    <g class="in mono" style="animation-delay:1.55s">
      <text x="52" y="282" font-size="20" fill="#39d353">$</text>
      <rect class="blink" x="76" y="264" width="12" height="21" fill="#39d353"/>
    </g>

    <!-- corner marks -->
    <path class="pulse" d="M1108 300 h-26 M1108 300 v-26" fill="none" stroke="#1f6feb" stroke-width="2" opacity="0.6"/>
  </g>

  <rect x="1" y="1" width="1117" height="317" rx="16" fill="none" stroke="#243040" stroke-width="1.5"/>
  <rect x="1" y="1" width="4" height="317" rx="2" fill="url(#edge)" opacity="0.9"/>
</svg>
